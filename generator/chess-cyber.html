<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#04050a;width:2560px;height:1600px;overflow:hidden}
  .wrap{position:relative;width:2560px;height:1600px;background:#05060d}
  .board{position:absolute;inset:0;display:grid;
    grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
  /* dim MAGENTA grid lines around each square */
  .sq{border:2px solid rgba(255,42,109,0.20);box-shadow:inset 0 0 20px rgba(255,42,109,0.05)}
  /* dark squares: blue-black */
  .d{background:linear-gradient(150deg,#070a14,#0c1422 60%,#080d18)}
  /* light squares: dark teal with faint cyan glow */
  .l{background:linear-gradient(150deg,#07202c,#0b3040 55%,#082735);
     box-shadow:inset 0 0 40px rgba(0,235,255,0.10)}
  /* hollow ghost king - centered, no frame */
  .king{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);
    font-family:'Apple Symbols','Arial Unicode MS','Noto Sans Symbols2',sans-serif;
    font-size:860px;line-height:1;
    color:rgba(210,218,235,0.05);
    -webkit-text-stroke:5px rgba(236,241,249,0.42);
    text-shadow:0 0 16px rgba(222,231,246,0.28), 0 0 46px rgba(205,218,242,0.15)}
</style></head><body>
<div class="wrap">
  <div class="board" id="board"></div>
  <div class="king">&#9818;</div>
</div>
<script>
  var b=document.getElementById('board');
  for(var r=0;r<8;r++){for(var c=0;c<8;c++){
    var d=document.createElement('div');
    d.className='sq '+(((r+c)%2)?'d':'l');
    b.appendChild(d);
  }}
</script>
</body></html>
