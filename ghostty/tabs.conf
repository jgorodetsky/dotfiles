# ghostty tab titles by rule. install.sh (ghostty-tabs) loads this from your main ghostty config with:
#   config-file = ?<this repo>/ghostty/tabs.conf
# shell/tabs.zsh sets the "<status> <icon> <name>" titles, this file makes them show.

# tab bar lives in the titlebar and takes the terminal background color
macos-titlebar-style = tabs

# ghostty's own titles off, they would overwrite the ones from shell/tabs.zsh
shell-integration-features = no-title
